<div *ngIf="isOpen" class="custom-toast" [ngClass]="type">
  <div class="toast-icon">
    <span *ngIf="type === 'success'">✓</span>
    <span *ngIf="type === 'error'">✕</span>
    <span *ngIf="type === 'warning'">⚠</span>
  </div>

  <div class="toast-content">
    <div class="toast-title">{{ headerText }}</div>
    <div class="toast-message">{{ message }}</div>
  </div>

  <button class="toast-close" (click)="onClose()">
    ×
  </button>
</div>
