<div *ngIf="isOpen" class="modal-backdrop">
  <div class="modal">
    
    <div class="modal-header" [ngClass]="type">
      <span>{{ type | uppercase }}</span>
      <span class="close-icon" (click)="close.emit()">×</span>
    </div>

    <div class="modal-body">
      {{ message }}
    </div>

    <div class="modal-footer">
      <button (click)="close.emit()">OK</button>
    </div>

  </div>
</div>
